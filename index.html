<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Website</title>
  <!-- FontAwesome (SNSアイコン用) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --navy: #0B132B;
      --yellow: #FFD166;
      --white: #FFFFFF;
      --gray: #F4F5F7;
      --text-dark: #1C2541;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      color: var(--text-dark);
      background-color: var(--gray);
      line-height: 1.6;
    }

    /* -----------------------------------
       ヘッダー & ハンバーガーメニュー
    ----------------------------------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      background-color: rgba(11, 19, 43, 0.9);
      backdrop-filter: blur(8px);
    }

    .site-logo {
      color: var(--yellow);
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 1px;
    }

    /* ハンバーガーボタン */
    .menu-btn {
      width: 30px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 102;
    }

    .menu-btn span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: var(--yellow);
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    /* メニュー開閉用アニメーション */
    .menu-btn.open span:nth-child(1) {
      transform: translateY(10.5px) rotate(45deg);
    }
    .menu-btn.open span:nth-child(2) {
      opacity: 0;
    }
    .menu-btn.open span:nth-child(3) {
      transform: translateY(-10.5px) rotate(-45deg);
    }

    /* スライド式ナビゲーション */
    .nav-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 300px;
      height: 100vh;
      background-color: var(--navy);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 101;
      box-shadow: -5px 0 20px rgba(0,0,0,0.3);
    }

    .nav-menu.active {
      right: 0;
    }

    /* 閉じるボタンエリア */
    .close-btn {
      align-self: flex-end;
      color: var(--yellow);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
      padding: 8px;
      transition: opacity 0.3s ease;
    }

    .close-btn:hover {
      opacity: 0.8;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .nav-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 18px;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--yellow);
    }

    /* -----------------------------------
       ヒーローセクション（名前・SNS & 写真）
    ----------------------------------- */
    .hero {
      display: flex;
      min-height: 100vh;
      padding-top: 70px;
    }

    /* 左側：ネイビー背景・イエロー文字・中央揃え */
    .hero-left {
      flex: 1;
      background-color: var(--navy);
      color: var(--yellow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center; /* 中央揃え */
      text-align: center;   /* テキスト中央揃え */
      padding: 60px 40px;
    }

    .hero-name {
      font-size: 48px;
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: 8px;
      color: var(--yellow);
    }

    .hero-name-en {
      font-size: 18px;
      color: var(--yellow); /* 黄色文字に変更 */
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    /* SNSアイコン */
    .social-links {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .social-links a {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      color: var(--yellow);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    /* note用カスタムスタイル */
    .social-links a .note-text {
      font-size: 14px;
      font-weight: bold;
      font-family: sans-serif;
    }

    .social-links a:hover {
      background-color: var(--yellow);
      color: var(--navy);
      transform: translateY(-3px);
    }

    /* 右側：写真１枚 */
    .hero-right {
      flex: 1;
      background-color: #e0e0e0;
      position: relative;
      overflow: hidden;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* -----------------------------------
       レスポンシブ対応（スマホ表示）
    ----------------------------------- */
    @media (max-width: 768px) {
      .hero {
        flex-direction: column-reverse;
      }
      .hero-left {
        padding: 40px 24px;
      }
      .hero-name {
        font-size: 36px;
      }
      .hero-right {
        min-height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- ヘッダー＆ハンバーガーメニュー -->
  <header>
    <div class="site-logo">OFFICIAL WEBSITE</div>
    <div class="menu-btn" id="menuBtn">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <!-- ナビゲーションメニュー -->
  <nav class="nav-menu" id="navMenu">
    <!-- 閉じるボタン -->
    <div class="close-btn" id="closeBtn">
      <span>閉じる</span> <i class="fa-solid fa-xmark"></i>
    </div>
    <div class="nav-links">
      <a href="#hero">TOP</a>
      <a href="#profile">プロフィール</a>
      <a href="#history">出演歴</a>
      <a href="#gallery">フォトギャラリー</a>
      <a href="#blog">ブログ</a>
      <a href="#contact">お問い合わせ</a>
    </div>
  </nav>

  <!-- メイン表示エリア -->
  <main class="hero" id="hero">
    <!-- 左側：テキスト＆SNS（中央揃え） -->
    <div class="hero-left">
      <h1 class="hero-name">あなたの お名前</h1>
      <p class="hero-name-en">YOUR NAME</p>
      
      <div class="social-links">
        <!-- X (Twitter) -->
        <a href="#" target="_blank" aria-label="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
        <!-- Instagram -->
        <a href="#" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <!-- note -->
        <a href="#" target="_blank" aria-label="note"><span class="note-text">note</span></a>
      </div>
    </div>

    <!-- 右側：写真 -->
    <div class="hero-right">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=80" alt="Main Photo" class="hero-img">
    </div>
  </main>

  <!-- JavaScript -->
  <script>
    const menuBtn = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const navMenu = document.getElementById('navMenu');

    // 開く
    menuBtn.addEventListener('click', () => {
      menuBtn.classList.add('open');
      navMenu.classList.add('active');
    });

    // 閉じるボタンで閉じる
    closeBtn.addEventListener('click', () => {
      menuBtn.classList.remove('open');
      navMenu.classList.remove('active');
    });

    // メニュー内のリンクを押したら自動で閉じる
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        menuBtn.classList.remove('open');
        navMenu.classList.remove('active');
      });
    });
  </script>

</body>
</html>
