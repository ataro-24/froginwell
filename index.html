<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私のホームページ</title>
  <style>
    /* CSS（デザインの指定だに） */
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f4f7f6;
      margin: 0;
      padding: 0;
    }
    header {
      background: #4a90e2;
      color: #fff;
      padding: 2rem 1rem;
      text-align: center;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: #fff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0; font-size: 1.8rem; }
    h2 { color: #4a90e2; border-bottom: 2px solid #4a90e2; padding-bottom: 0.3rem; }
    footer {
      text-align: center;
      padding: 1rem;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>ようこそ！私のホームページへ</h1>
  </header>

  <main>
    <section class="card">
      <h2>自己紹介</h2>
      <p>はじめまして！このページはGitHubとCloudflare Pagesを使って作成しました。</p>
      <p>これから少しずつページを更新していく予定だに！</p>
    </section>

    <section class="card">
      <h2>好きなこと・趣味</h2>
      <ul>
        <li>読書・映画鑑賞</li>
        <li>カフェ巡り</li>
        <li>新しい技術の勉強</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>

</body>
</html>
