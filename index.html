<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Profile</title>
  <style>
    /* 全体のカラーパレット定義 */
    :root {
      --bg-color: #0B132B;       /* 深みのあるリッチネイビー（背景） */
      --card-bg: #1C2541;        /* やや明るいネイビー（カード背景） */
      --accent-color: #FFD166;   /* 鮮やかでやさしいイエロー（アクセント） */
      --text-main: #FFFFFF;      /* メインテキスト（白） */
      --text-sub: #C5D3E8;       /* サブテキスト（淡いブルーグレー） */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* メインカードのスタイリング */
    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 209, 102, 0.15); /* イエロートリムのさりげない光 */
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    /* アイコン / アバター枠 */
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: var(--accent-color);
      color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: bold;
      margin: 0 auto 24px auto;
      box-shadow: 0 0 20px rgba(255, 209, 102, 0.3);
    }

    h1 {
      font-size: 28px;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    /* イエローのアクセントテキスト */
    .subtitle {
      color: var(--accent-color);
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    .bio {
      color: var(--text-sub);
      font-size: 15px;
      margin-bottom: 32px;
    }

    /* SNS・リンクボタンエリア */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      background-color: transparent;
      color: var(--accent-color);
      border: 2px solid var(--accent-color);
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    /* ホバー時の黄色の反転エフェクト */
    .btn:hover {
      background-color: var(--accent-color);
      color: var(--bg-color);
      box-shadow: 0 0 15px rgba(255, 209, 102, 0.4);
      transform: translateY(-2px);
    }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-sub);
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- イニシャルや好きな一文字を入れられるアイコン -->
    <div class="avatar">Y</div>
    
    <h1>Your Name</h1>
    <div class="subtitle">WELCOME TO MY WEBSITE</div>
    
    <p class="bio">
      ネイビーとイエローをベースにしたパーソナルページへようこそ！<br>
      ここに好きなプロフィールや自己紹介の文章を書いてみてね。
    </p>

    <!-- ボタン（リンク）エリア -->
    <div class="links">
      <a href="#" class="btn">GitHub</a>
      <a href="#" class="btn">X (Twitter)</a>
      <a href="#" class="btn">お問い合わせ</a>
    </div>

    <footer>
      &copy; 2026 My Website
    </footer>
  </div>

</body>
</html>
