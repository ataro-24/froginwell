<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ataro website</title>
  
  <!-- FontAwesome (SNSアイコン用) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts (Zen Maru Gothic & Caveat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0B132B;
      --yellow: #FFD166;
      --white: #FFFFFF;
      --gray: #F4F5F7;
      --text-dark: #1C2541;
      
      /* 白地に黒字のモノクロ用定義 */
      --mono-bg: #FFFFFF;
      --mono-icon: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* サイト全体の日本語基本フォント */
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 400;
      color: var(--text-dark);
      background-color: var(--gray);
      line-height: 1.6;
    }

    /* -----------------------------------
       ヘッダー & ハンバーガーメニュー
    ----------------------------------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      background-color: rgba(11, 19, 43, 0.9);
      backdrop-filter: blur(8px);
    }

    /* 英字ロゴ：Caveat (Ataro website) */
    .site-logo {
      color: var(--yellow);
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 1px;
    }

    /* ハンバーガーボタン */
    .menu-btn {
      width: 30px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 102;
    }

    .menu-btn span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: var(--yellow);
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    .menu-btn.open span:nth-child(1) {
      transform: translateY(10.5px) rotate(45deg);
    }
    .menu-btn.open span:nth-child(2) {
      opacity: 0;
    }
    .menu-btn.open span:nth-child(3) {
      transform: translateY(-10.5px) rotate(-45deg);
    }

    /* スライド式ナビゲーション */
    .nav-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 300px;
      height: 100vh;
      background-color: var(--navy);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 101;
      box-shadow: -5px 0 20px rgba(0,0,0,0.3);
    }

    .nav-menu.active {
      right: 0;
    }

    .close-btn {
      align-self: flex-end;
      color: var(--yellow);
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 400;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
      padding: 8px;
      transition: opacity 0.3s ease;
    }

    .close-btn:hover {
      opacity: 0.8;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .nav-links a {
      color: var(--yellow);
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 500;
      text-decoration: none;
      font-size: 20px;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }

    .nav-links a.en-link {
      font-family: 'Caveat', cursive;
      font-size: 26px;
    }

    .nav-links a:hover {
      opacity: 0.75;
      transform: translateX(4px);
    }

    /* -----------------------------------
       ヒーローセクション
    ----------------------------------- */
    .hero {
      display: flex;
      min-height: 100vh;
      padding-top: 70px;
    }

    .hero-left {
      flex: 1;
      background-color: var(--navy);
      color: var(--yellow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 40px;
    }

    .hero-name {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 700;
      font-size: 48px;
      line-height: 1.2;
      margin-bottom: 8px;
      color: var(--yellow);
    }

    .hero-name-en {
      font-family: 'Caveat', cursive;
      font-size: 32px;
      color: var(--yellow);
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    /* 白地に黒アイコンのSNSエリア */
    .social-links {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .social-links a {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--mono-bg); /* 背景：白 */
      color: var(--mono-icon); /* 文字/アイコン：黒 */
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    /* SVGアイコン（note）のカラー適用 */
    .social-links a svg {
      width: 24px;
      height: 24px;
      fill: var(--mono-icon); /* アイコン：黒 */
      transition: fill 0.3s ease;
    }

    /* ホバー時の演出（黒地に白文字へ反転） */
    .social-links a:hover {
      background-color: var(--mono-icon); /* 背景：黒 */
      color: var(--mono-bg); /* 文字/アイコン：白 */
      transform: translateY(-3px);
    }

    .social-links a:hover svg {
      fill: var(--mono-bg); /* アイコン：白 */
    }

    .hero-right {
      flex: 1;
      background-color: #e0e0e0;
      position: relative;
      overflow: hidden;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* レスポンシブ対応 */
    @media (max-width: 768px) {
      .hero {
        flex-direction: column-reverse;
      }
      .hero-left {
        padding: 40px 24px;
      }
      .hero-name {
        font-size: 36px;
      }
      .hero-name-en {
        font-size: 26px;
      }
      .hero-right {
        min-height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- ヘッダー＆ハンバーガーメニュー -->
  <header>
    <div class="site-logo">Ataro website</div>
    <div class="menu-btn" id="menuBtn">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <!-- ナビゲーションメニュー -->
  <nav class="nav-menu" id="navMenu">
    <div class="close-btn" id="closeBtn">
      <span>閉じる</span> <i class="fa-solid fa-xmark"></i>
    </div>
    <div class="nav-links">
      <a href="#hero" class="en-link">TOP</a>
      <a href="#profile">プロフィール</a>
      <a href="#history">出演歴</a>
      <a href="#portfolio">ポートフォリオ</a>
      <a href="#blog">ブログ</a>
      <a href="#contact">お問い合わせ</a>
    </div>
  </nav>

  <!-- メイン表示エリア -->
  <main class="hero" id="hero">
    <div class="hero-left">
      <h1 class="hero-name">高井 蛙太郎</h1>
      <p class="hero-name-en">Takai　Ataro</p>
      
      <!-- 白地に黒アイコン（ガイドライン準拠） -->
      <div class="social-links">
        <!-- X (Twitter) -->
        <a href="#" target="_blank" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        
        <!-- Instagram -->
        <a href="#" target="_blank" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        
        <!-- note (新SVG反映済み) -->
        <a href="#" target="_blank" aria-label="note">
          <svg viewBox="0 0 493 493" aria-hidden="true">
            <path d="m139.57,142.06c41.19,0,97.6-2.09,138.1-1.04,54.34,1.39,74.76,25.06,75.45,83.53.69,33.06,0,127.73,0,127.73h-58.79c0-82.83.35-96.5,0-122.6-.69-22.97-7.25-33.92-24.9-36.01-18.69-2.09-71.07-.35-71.07-.35v158.96h-58.79v-210.22Z" />
          </svg>
        </a>
      </div>
    </div>

    <div class="hero-right">
      <img src="2406156648.jpg" alt="高井蛙太郎" class="hero-img">
    </div>
  </main>

  <!-- JavaScript -->
  <script>
    const menuBtn = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const navMenu = document.getElementById('navMenu');

    menuBtn.addEventListener('click', () => {
      menuBtn.classList.add('open');
      navMenu.classList.add('active');
    });

    closeBtn.addEventListener('click', () => {
      menuBtn.classList.remove('open');
      navMenu.classList.remove('active');
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        menuBtn.classList.remove('open');
        navMenu.classList.remove('active');
      });
    });
  </script>

</body>
</html>
