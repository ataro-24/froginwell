<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ataro website</title>
  
  <!-- FontAwesome (SNSアイコン用) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts (Zen Maru Gothic & Caveat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0B132B;
      --yellow: #FFD166;
      --white: #FFFFFF;
      --gray: #F4F5F7;
      --text-dark: #1C2541;
      
      /* 白地に黒字のモノクロ用定義 */
      --mono-bg: #FFFFFF;
      --mono-icon: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* サイト全体の日本語基本フォント */
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 400;
      color: var(--text-dark);
      background-color: var(--gray);
      line-height: 1.6;
    }

    /* -----------------------------------
       ヘッダー & ハンバーガーメニュー
    ----------------------------------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      background-color: rgba(11, 19, 43, 0.9);
      backdrop-filter: blur(8px);
    }

    /* 英字ロゴ：Caveat (Ataro website) */
    .site-logo {
      color: var(--yellow);
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 1px;
    }

    /* ハンバーガーボタン */
    .menu-btn {
      width: 30px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 102;
    }

    .menu-btn span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: var(--yellow);
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    .menu-btn.open span:nth-child(1) {
      transform: translateY(10.5px) rotate(45deg);
    }
    .menu-btn.open span:nth-child(2) {
      opacity: 0;
    }
    .menu-btn.open span:nth-child(3) {
      transform: translateY(-10.5px) rotate(-45deg);
    }

    /* スライド式ナビゲーション */
    .nav-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 300px;
      height: 100vh;
      background-color: var(--navy);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 101;
      box-shadow: -5px 0 20px rgba(0,0,0,0.3);
    }

    .nav-menu.active {
      right: 0;
    }

    .close-btn {
      align-self: flex-end;
      color: var(--yellow);
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 400;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
      padding: 8px;
      transition: opacity 0.3s ease;
    }

    .close-btn:hover {
      opacity: 0.8;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .nav-links a {
      color: var(--yellow);
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 500;
      text-decoration: none;
      font-size: 20px;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }

    .nav-links a.en-link {
      font-family: 'Caveat', cursive;
      font-size: 26px;
    }

    .nav-links a:hover {
      opacity: 0.75;
      transform: translateX(4px);
    }

    /* -----------------------------------
       ヒーローセクション
    ----------------------------------- */
    .hero {
      display: flex;
      min-height: 100vh;
      padding-top: 70px;
    }

    .hero-left {
      flex: 1;
      background-color: var(--navy);
      color: var(--yellow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 40px;
    }

    /* お名前の表示（約1.5倍に拡大） */
    .hero-name {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 700;
      font-size: 72px; /* 48px -> 72px */
      line-height: 1.2;
      margin-bottom: 8px;
      color: var(--yellow);
    }

    .hero-name-en {
      font-family: 'Caveat', cursive;
      font-size: 48px; /* 32px -> 48px */
      color: var(--yellow);
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    /* 白地に黒アイコンのSNSエリア（サイズ拡大） */
    .social-links {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .social-links a {
      width: 56px; /* ボタン枠を拡大 */
      height: 56px;
      border-radius: 50%;
      background-color: var(--mono-bg); /* 背景：白 */
      color: var(--mono-icon); /* 文字/アイコン：黒 */
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px; /* アイコンサイズを30pxへ変更 */
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    /* SVGアイコン（note）のサイズ・カラー調整 */
    .social-links a svg {
      width: 30px; /* noteロゴを30px指定 */
      height: 30px;
      fill: var(--mono-icon); /* アイコン：黒 */
      transition: fill 0.3s ease;
    }

    /* ホバー時の演出（黒地に白文字へ反転） */
    .social-links a:hover {
      background-color: var(--mono-icon); /* 背景：黒 */
      color: var(--mono-bg); /* 文字/アイコン：白 */
      transform: translateY(-3px);
    }

    .social-links a:hover svg {
      fill: var(--mono-bg); /* アイコン：白 */
    }

    .hero-right {
      flex: 1;
      background-color: #e0e0e0;
      position: relative;
      overflow: hidden;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* レスポンシブ対応 */
    @media (max-width: 768px) {
      .hero {
        flex-direction: column-reverse;
      }
      .hero-left {
        padding: 40px 24px;
      }
      .hero-name {
        font-size: 52px;
      }
      .hero-name-en {
        font-size: 36px;
      }
      .hero-right {
        min-height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- ヘッダー＆ハンバーガーメニュー -->
  <header>
    <div class="site-logo">Ataro website</div>
    <div class="menu-btn" id="menuBtn">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <!-- ナビゲーションメニュー -->
  <nav class="nav-menu" id="navMenu">
    <div class="close-btn" id="closeBtn">
      <span>閉じる</span> <i class="fa-solid fa-xmark"></i>
    </div>
    <div class="nav-links">
      <a href="#hero" class="en-link">TOP</a>
      <a href="#profile">プロフィール</a>
      <a href="#history">出演歴</a>
      <a href="#portfolio">ポートフォリオ</a>
      <a href="#blog">ブログ</a>
      <a href="#contact">お問い合わせ</a>
    </div>
  </nav>

  <!-- メイン表示エリア -->
  <main class="hero" id="hero">
    <div class="hero-left">
      <h1 class="hero-name">高井 蛙太郎</h1>
      <p class="hero-name-en">Takai　Ataro</p>
      
      <!-- 白地に黒アイコン（ガイドライン準拠＆30px統一） -->
      <div class="social-links">
        <!-- X (Twitter) -->
        <a href="https://x.com/notakanon" target="_blank" aria-label="X (Twitter)">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        
        <!-- Instagram -->
        <a href="https://www.instagram.com/notakanon" target="_blank" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        
        <!-- note (指定SVG・30px対応) -->
        <a href="https://note.com/flaxenfrog" target="_blank" aria-label="note">
          <svg viewBox="0 0 500 500" aria-hidden="true">
            <path d="M105.251 215.151C90.5437 214.742 69.9529 215.559 55 215.559V292.039H76.4079V234.189C76.4079 234.189 95.4463 233.535 102.31 234.352C108.765 235.088 111.135 239.092 111.38 247.426C111.543 256.904 111.38 261.889 111.38 292.039H132.788C132.788 292.039 133.033 257.558 132.788 245.547C132.461 224.22 125.025 215.641 105.251 215.151Z" />
            <path d="M204.283 214.906C183.121 214.906 165.88 232.228 165.88 253.554C165.88 274.881 183.121 292.203 204.283 292.203C225.446 292.203 242.687 274.881 242.687 253.554C242.687 232.228 225.446 214.906 204.283 214.906ZM204.283 273.737C193.171 273.737 184.183 264.667 184.183 253.473C184.183 242.278 193.171 233.209 204.283 233.209C215.396 233.209 224.384 242.278 224.384 253.473C224.384 264.749 215.396 273.737 204.283 273.737Z" />
            <path d="M445 253.554C445 232.228 427.759 214.906 406.596 214.906C385.434 214.906 368.193 232.228 368.193 253.554C368.193 266.056 373.913 276.76 382.819 283.869C389.029 288.771 397.69 292.203 409.293 292.203C414.931 292.203 429.557 290.651 440.097 278.966L431.436 267.363C427.759 270.632 418.526 275.207 411.172 275.207C401.857 275.207 396.219 273.41 392.134 269.569C389.601 267.282 387.803 263.768 386.986 259.438H444.428C444.755 257.476 445 255.597 445 253.554ZM387.15 246.527C389.274 237.458 395.647 230.757 406.515 230.757C417.872 230.757 423.837 237.948 425.798 246.527H387.15Z" />
            <path d="M315.408 207.797H295.39V229.287H274.799V248.08H295.39V270.387H315.408V248.08H335.999V229.287H315.408V207.797Z" />
          </svg>
        </a>
      </div>
    </div>

    <div class="hero-right">
      <img src="2406156648.jpg" alt="高井蛙太郎" class="hero-img">
    </div>
  </main>

  <!-- JavaScript -->
  <script>
    const menuBtn = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const navMenu = document.getElementById('navMenu');

    menuBtn.addEventListener('click', () => {
      menuBtn.classList.add('open');
      navMenu.classList.add('active');
    });

    closeBtn.addEventListener('click', () => {
      menuBtn.classList.remove('open');
      navMenu.classList.remove('active');
    });

document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        menuBtn.classList.remove('open');
        navMenu.classList.remove('active');
      });
    });
  </script>
